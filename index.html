<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FM Tuner">
<meta name="theme-color" content="#14171c">
<title>FM Tuner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* Layout idea: one fixed screen like a car head unit. Lit display on top, sliding dial under a fixed needle, big thumb controls, six presets, station list. */
:root {
  --body: #14171c;        /* head-unit plastic */
  --panel: #1d2128;       /* raised panels and buttons */
  --edge: #2c323c;        /* bevels and borders */
  --glass: #2a1c08;       /* unlit display glass */
  --lit: #ffb347;         /* backlight amber */
  --needle: #ff4b3a;      /* tuning needle */
  --label: #8f98a6;       /* printed labels */
  --font-display: "Share Tech Mono", ui-monospace, Menlo, monospace;
  --font-body: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--body);
  color: var(--label);
  font-family: var(--font-body);
  font-size: 17px;
  letter-spacing: .04em;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
}
.unit {
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px);
}
button, select, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--lit); outline-offset: 2px; }

/* Top bar */
.bar { display: flex; align-items: center; gap: 10px; }
.brand { font-weight: 700; font-size: 20px; color: #d7dce4; text-transform: uppercase; margin-right: auto; }
.brand small { font-size: 13px; font-weight: 500; color: var(--label); margin-left: 6px; }
.bar select, .bar input {
  background: var(--panel); border: 1px solid var(--edge); border-radius: 8px;
  height: 36px; padding: 0 10px; color: #d7dce4; text-transform: uppercase; font-size: 15px;
}
.bar input { width: 104px; text-transform: none; }
.bar input::placeholder { color: var(--label); }

/* Display */
.display {
  background: radial-gradient(120% 140% at 50% 0%, #3a270b 0%, var(--glass) 60%);
  border: 1px solid #000; border-radius: 12px;
  box-shadow: inset 0 2px 10px rgba(0,0,0,.7), 0 1px 0 var(--edge);
  padding: 12px 14px 10px;
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: end;
  color: var(--lit);
  transition: color .3s, text-shadow .3s;
  text-shadow: 0 0 12px rgba(255,179,71,.55);
}
.unit.off .display { color: #5a3f17; text-shadow: none; }
.freq { font-family: var(--font-display); font-size: 62px; line-height: 1; font-variant-numeric: tabular-nums; }
.freq span { font-size: 20px; margin-left: 6px; }
.meta { text-align: right; font-size: 14px; text-transform: uppercase; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.bars { display: flex; gap: 3px; align-items: flex-end; height: 18px; }
.bars i { width: 4px; background: currentColor; opacity: .22; border-radius: 1px; }
.bars i:nth-child(1){height:5px} .bars i:nth-child(2){height:8px} .bars i:nth-child(3){height:11px} .bars i:nth-child(4){height:14px} .bars i:nth-child(5){height:18px}
.bars.on i { opacity: 1; }
.bars.busy i { animation: scan 1s infinite; }
.bars.busy i:nth-child(2){animation-delay:.1s} .bars.busy i:nth-child(3){animation-delay:.2s} .bars.busy i:nth-child(4){animation-delay:.3s} .bars.busy i:nth-child(5){animation-delay:.4s}
@keyframes scan { 0%,100% { opacity:.22 } 50% { opacity:1 } }
.name {
  grid-column: 1 / -1; font-size: 24px; font-weight: 600; text-transform: uppercase;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 29px;
}
.status { grid-column: 1 / -1; font-size: 14px; text-transform: uppercase; opacity: .8; min-height: 17px; }

/* Dial */
.dial {
  position: relative; height: 76px; overflow: hidden; touch-action: none; cursor: grab;
  background: linear-gradient(#0d0f12, #181b21);
  border: 1px solid #000; border-radius: 12px;
  box-shadow: inset 0 2px 8px rgba(0,0,0,.8), 0 1px 0 var(--edge);
}
.dial:active { cursor: grabbing; }
.strip { position: absolute; top: 0; bottom: 0; left: 0; will-change: transform; }
.ticks {
  position: absolute; left: 0; right: 0; top: 0; height: 30px;
  background:
    repeating-linear-gradient(90deg, #c9cfd8 0 2px, transparent 2px 60px) 0 0 / 100% 22px no-repeat,
    repeating-linear-gradient(90deg, #6d7684 0 1px, transparent 1px 12px) 0 0 / 100% 12px no-repeat;
}
.num { position: absolute; top: 28px; transform: translateX(-50%); font-family: var(--font-display); font-size: 14px; color: #c9cfd8; }
.mark { position: absolute; bottom: 8px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--lit); opacity: .45; }
.mark.local { opacity: 1; box-shadow: 0 0 8px var(--lit); }
.needle { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px; background: var(--needle); box-shadow: 0 0 10px var(--needle); pointer-events: none; }
.dial::before, .dial::after { content: ""; position: absolute; top: 0; bottom: 0; width: 56px; z-index: 1; pointer-events: none; }
.dial::before { left: 0; background: linear-gradient(90deg, #0d0f12, transparent); }
.dial::after { right: 0; background: linear-gradient(-90deg, #0d0f12, transparent); }

/* Controls */
.controls { display: grid; grid-template-columns: 1fr 84px 1fr; gap: 12px; align-items: center; }
.key {
  height: 56px; border-radius: 12px; border: 1px solid var(--edge);
  background: linear-gradient(#262b34, var(--panel));
  box-shadow: 0 2px 0 #000; color: #d7dce4;
  font-weight: 600; font-size: 17px; text-transform: uppercase;
}
.key:active { transform: translateY(2px); box-shadow: none; }
.power { height: 84px; border-radius: 50%; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.power svg { width: 26px; height: 26px; }
.unit:not(.off) .power { color: var(--lit); border-color: #7a5520; box-shadow: 0 2px 0 #000, 0 0 18px rgba(255,179,71,.25); }

.presets { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.preset { height: 50px; padding: 0 2px; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; overflow: hidden; }
.preset b { font-family: var(--font-display); font-size: 17px; font-weight: 400; }
.preset.set b { color: var(--lit); }
.preset span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--label); }
.hint { font-size: 13px; text-transform: uppercase; text-align: center; margin: -4px 0; }

/* Station list */
.list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; border-top: 1px solid var(--edge); }
.row {
  width: 100%; display: grid; grid-template-columns: 62px 1fr auto; gap: 10px; align-items: baseline;
  padding: 11px 4px; background: none; border: 0; border-bottom: 1px solid #20242b; text-align: left;
}
.row .f { font-family: var(--font-display); font-size: 18px; color: #d7dce4; font-variant-numeric: tabular-nums; }
.row .n { color: #d7dce4; font-size: 18px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t { font-size: 13px; text-transform: uppercase; }
.row.on .f, .row.on .n { color: var(--lit); }
.empty { padding: 24px 4px; text-align: center; line-height: 1.4; }
.empty button { margin-top: 12px; padding: 0 20px; }
@media (max-height: 640px) { .freq { font-size: 48px; } .power { height: 68px; } .controls { grid-template-columns: 1fr 68px 1fr; } .hint { display: none; } }
@media (prefers-reduced-motion: reduce) { .bars.busy i { animation: none; opacity: .6; } .strip { transition: none !important; } }
</style>
</head>
<body>
<div class="unit off" id="unit">
  <div class="bar">
    <div class="brand">FM Tuner<small>87.5 to 108</small></div>
    <input id="search" type="search" placeholder="Find station" autocomplete="off" aria-label="Find a station by name">
    <select id="region" aria-label="Area"></select>
  </div>

  <div class="display" aria-live="polite">
    <div class="freq"><b id="freq" style="font-weight:400">98.3</b><span>MHz</span></div>
    <div class="meta"><div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></div><div id="mode">Stereo</div></div>
    <div class="name" id="name">Loading stations</div>
    <div class="status" id="status">Radio is off</div>
  </div>

  <div class="dial" id="dial" role="slider" tabindex="0" aria-label="Tuning dial" aria-valuemin="87.5" aria-valuemax="108" aria-valuenow="98.3">
    <div class="strip" id="strip"><div class="ticks"></div></div>
    <div class="needle"></div>
  </div>

  <div class="controls">
    <button class="key" id="prev" type="button">&#9664;&nbsp; Seek</button>
    <button class="key power" id="power" type="button" aria-label="Turn radio on or off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
    </button>
    <button class="key" id="next" type="button">Seek &nbsp;&#9654;</button>
  </div>

  <div class="presets" id="presets"></div>
  <div class="hint">Hold a number to save the station you are on</div>

  <div class="list" id="list"></div>
</div>

<audio id="audio" preload="none" playsinline></audio>

<script>
(function () {
  "use strict";
  var MIN = 87.5, MAX = 108, PPM = 60, PAD = 400;
  var MIRRORS = ["de1", "nl1", "at1", "de2", "fi1"];
  var REGIONS = [
    ["Mumbai", ["mumbai", "bombay", "maharashtra", "marathi"]],
    ["Delhi", ["delhi", "ncr", "noida", "gurgaon"]],
    ["Bengaluru", ["bengaluru", "bangalore", "karnataka", "kannada"]],
    ["Kolkata", ["kolkata", "calcutta", "west bengal", "bengali", "bangla"]],
    ["Chennai", ["chennai", "madras", "tamil"]],
    ["Hyderabad", ["hyderabad", "telangana", "telugu"]],
    ["Pune", ["pune", "maharashtra", "marathi"]],
    ["Punjab", ["punjab", "punjabi", "chandigarh", "amritsar", "ludhiana"]],
    ["All India", []]
  ];

  var $ = function (id) { return document.getElementById(id); };
  var unit = $("unit"), audio = $("audio"), dial = $("dial"), strip = $("strip");
  var elFreq = $("freq"), elName = $("name"), elStatus = $("status"), elBars = $("bars"), elMode = $("mode");
  var elList = $("list"), elRegion = $("region"), elSearch = $("search"), elPresets = $("presets");

  var all = [];        // every station from the directory
  var band = [];       // stations placed on the dial, sorted by frequency
  var current = null;  // station under the needle
  var freq = 98.3;
  var on = false;
  var presets = load("fm.presets", [null, null, null, null, null, null]);

  function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function clamp(v) { return Math.min(MAX, Math.max(MIN, v)); }
  function fmt(f) { return f.toFixed(1); }

  /* ---------- dial ---------- */
  strip.style.width = ((MAX - MIN) * PPM + PAD * 2) + "px";
  var ticks = strip.querySelector(".ticks");
  ticks.style.left = (PAD - 30 - 1) + "px"; // 87.5 sits half a MHz before the 88 line
  ticks.style.right = "auto";
  ticks.style.width = ((MAX - MIN) * PPM + 62) + "px";
  ticks.style.backgroundPosition = "0 0, 6px 0";
  for (var m = 88; m <= 108; m += 2) {
    var n = document.createElement("div");
    n.className = "num"; n.textContent = m; n.style.left = x(m) + "px";
    strip.appendChild(n);
  }
  function x(f) { return PAD + (f - MIN) * PPM; }
  function renderDial(animate) {
    strip.style.transition = animate ? "transform .35s cubic-bezier(.2,.8,.2,1)" : "none";
    strip.style.transform = "translateX(" + (dial.clientWidth / 2 - x(freq)) + "px)";
    elFreq.textContent = fmt(freq);
    dial.setAttribute("aria-valuenow", fmt(freq));
  }
  function nearest(f) {
    var best = null, d = 1e9;
    band.forEach(function (s) { var dd = Math.abs(s.f - f); if (dd < d) { d = dd; best = s; } });
    return best;
  }

  var drag = null;
  dial.addEventListener("pointerdown", function (e) {
    drag = { x: e.clientX, f: freq };
    dial.setPointerCapture(e.pointerId);
    audio.muted = true;
  });
  dial.addEventListener("pointermove", function (e) {
    if (!drag) return;
    freq = clamp(drag.f - (e.clientX - drag.x) / PPM);
    renderDial(false);
    var s = nearest(freq);
    var hit = s && Math.abs(s.f - freq) < 0.12;
    elName.textContent = hit ? s.name : "· · ·";
    elBars.className = "bars" + (hit && on ? " on" : "");
  });
  function endDrag() {
    if (!drag) return;
    drag = null; audio.muted = false;
    var s = nearest(freq);
    if (s) tune(s, true); else renderDial(true);
  }
  dial.addEventListener("pointerup", endDrag);
  dial.addEventListener("pointercancel", endDrag);
  dial.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { seek(1); e.preventDefault(); }
    if (e.key === "ArrowLeft") { seek(-1); e.preventDefault(); }
  });
  window.addEventListener("resize", function () { renderDial(false); });

  /* ---------- playback ---------- */
  function setStatus(text, bars) {
    elStatus.textContent = text;
    elBars.className = "bars" + (bars ? " " + bars : "");
  }
  function tune(s, userAction) {
    current = s; freq = s.f;
    renderDial(true);
    elName.textContent = s.name;
    elMode.textContent = s.bitrate ? s.bitrate + " kbps" : "Stereo";
    save("fm.last", s.id);
    markList();
    if (on) play(); else setStatus("Radio is off. Press the power button.");
    if ("mediaSession" in navigator) {
      try { navigator.mediaSession.metadata = new MediaMetadata({ title: s.name, artist: fmt(s.f) + " MHz", album: "FM Tuner" }); } catch (e) {}
    }
  }
  function play() {
    if (!current) return;
    setStatus("Tuning", "busy");
    audio.src = current.url;
    var p = audio.play();
    if (p && p.catch) p.catch(function (err) {
      if (err && err.name === "NotAllowedError") { power(false); setStatus("Press the power button to start"); }
    });
  }
  function power(state) {
    on = state;
    unit.classList.toggle("off", !on);
    if (on) { if (current) play(); else setStatus("No station here. Drag the dial or press Seek."); }
    else { audio.pause(); audio.removeAttribute("src"); audio.load(); setStatus("Radio is off"); }
  }
  function seek(dir) {
    if (!band.length) return;
    var i = current ? band.indexOf(current) : -1, next;
    if (i < 0) {
      next = dir > 0 ? band.filter(function (s) { return s.f > freq; })[0] || band[0]
                     : band.filter(function (s) { return s.f < freq; }).pop() || band[band.length - 1];
    } else next = band[(i + dir + band.length) % band.length];
    tune(next, true);
  }
  audio.addEventListener("playing", function () { if (on) setStatus("On air", "on"); });
  audio.addEventListener("waiting", function () { if (on) setStatus("Buffering", "busy"); });
  audio.addEventListener("stalled", function () { if (on && audio.paused) setStatus("Weak signal", "busy"); });
  audio.addEventListener("error", function () { if (on && audio.getAttribute("src")) setStatus("No signal from this station. Press Seek for the next one."); });

  $("power").addEventListener("click", function () { power(!on); });
  $("next").addEventListener("click", function () { seek(1); });
  $("prev").addEventListener("click", function () { seek(-1); });
  if ("mediaSession" in navigator) {
    try {
      navigator.mediaSession.setActionHandler("nexttrack", function () { seek(1); });
      navigator.mediaSession.setActionHandler("previoustrack", function () { seek(-1); });
      navigator.mediaSession.setActionHandler("play", function () { power(true); });
      navigator.mediaSession.setActionHandler("pause", function () { power(false); });
    } catch (e) {}
  }

  /* ---------- presets ---------- */
  function renderPresets() {
    elPresets.textContent = "";
    presets.forEach(function (p, i) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "key preset" + (p ? " set" : "");
      b.setAttribute("aria-label", "Preset " + (i + 1) + (p ? ", " + p.name : ", empty"));
      var num = document.createElement("b"); num.textContent = i + 1;
      var lab = document.createElement("span"); lab.textContent = p ? fmt(p.f) : "empty";
      b.appendChild(num); b.appendChild(lab);
      var timer = null, held = false;
      b.addEventListener("pointerdown", function () {
        held = false;
        timer = setTimeout(function () {
          held = true;
          if (!current) return;
          presets[i] = { id: current.id, name: current.name, url: current.url, f: current.f, bitrate: current.bitrate };
          save("fm.presets", presets); renderPresets();
          setStatus("Saved to preset " + (i + 1), on ? "on" : "");
        }, 600);
      });
      ["pointerup", "pointerleave", "pointercancel"].forEach(function (ev) { b.addEventListener(ev, function () { clearTimeout(timer); }); });
      b.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      b.addEventListener("click", function () {
        if (held) return;
        if (!presets[i]) { setStatus("Preset " + (i + 1) + " is empty. Hold it to save this station."); return; }
        var s = band.filter(function (t) { return t.id === presets[i].id; })[0];
        if (!s) { s = presets[i]; band.push(s); band.sort(byF); renderMarks(); renderList(); }
        if (!on) power(true);
        tune(s, true);
      });
      elPresets.appendChild(b);
    });
  }

  /* ---------- station directory ---------- */
  function byF(a, b) { return a.f - b.f; }
  function parseFreq(name) {
    var m = /(?:^|[^\d.])((?:8[7-9]|9\d|10[0-7])(?:\.\d)?)(?![\d.])/.exec(name);
    if (!m) return null;
    var f = parseFloat(m[1]);
    return f >= MIN && f <= MAX ? f : null;
  }
  function buildBand() {
    var q = elSearch.value.trim().toLowerCase();
    var keys = (REGIONS.filter(function (r) { return r[0] === elRegion.value; })[0] || REGIONS[0])[1];
    var picked = [], seen = {};
    function take(s, local) {
      var key = s.name.toLowerCase().replace(/[^a-z0-9]/g, "");
      if (seen[key] || picked.length >= 36) return;
      seen[key] = 1; picked.push({ id: s.id, name: s.name, url: s.url, bitrate: s.bitrate, tags: s.tags, local: local, want: parseFreq(s.name) });
    }
    if (q) all.forEach(function (s) { if (s.hay.indexOf(q) >= 0) take(s, true); });
    else {
      if (keys.length) all.forEach(function (s) { if (keys.some(function (k) { return s.hay.indexOf(k) >= 0; })) take(s, true); });
      var room = Math.max(24, picked.length);
      all.forEach(function (s) { if (picked.length < room) take(s, !keys.length); });
    }
    // Put stations on a 0.2 MHz grid: real frequencies first, the rest spread across the gaps.
    var slots = [], used = {};
    for (var i = 0; i <= 101; i++) slots.push(Math.round((87.7 + i * 0.2) * 10) / 10);
    function claim(want) {
      var best = -1, d = 1e9;
      slots.forEach(function (f, j) { if (!used[j] && Math.abs(f - want) < d) { d = Math.abs(f - want); best = j; } });
      used[best] = 1; return slots[best];
    }
    picked.filter(function (s) { return s.want; }).forEach(function (s) { s.f = claim(s.want); });
    var rest = picked.filter(function (s) { return !s.want; });
    rest.forEach(function (s, j) { s.f = claim(88.1 + (j + 0.5) * (19.4 / rest.length)); });
    band = picked.sort(byF);
    renderMarks(); renderList();
    if (!band.length) { current = null; elName.textContent = q ? "No match" : "No stations"; return; }
    var lastId = load("fm.last", null);
    var s = (current && band.filter(function (t) { return t.id === current.id; })[0]) ||
            band.filter(function (t) { return t.id === lastId; })[0] ||
            band.filter(function (t) { return t.local; })[0] || band[0];
    if (current && s.id === current.id) { current = s; freq = s.f; renderDial(true); markList(); }
    else tune(s, false);
  }
  function renderMarks() {
    Array.prototype.slice.call(strip.querySelectorAll(".mark")).forEach(function (n) { n.remove(); });
    band.forEach(function (s) {
      var d = document.createElement("div");
      d.className = "mark" + (s.local ? " local" : ""); d.style.left = x(s.f) + "px";
      strip.appendChild(d);
    });
  }
  function renderList() {
    elList.textContent = "";
    if (!band.length) { message("No stations match. Clear the search or pick another area."); return; }
    band.forEach(function (s) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "row"; b.dataset.id = s.id;
      var f = document.createElement("span"); f.className = "f"; f.textContent = fmt(s.f);
      var n = document.createElement("span"); n.className = "n"; n.textContent = s.name;
      var t = document.createElement("span"); t.className = "t"; t.textContent = s.local ? "Local" : "";
      b.appendChild(f); b.appendChild(n); b.appendChild(t);
      b.addEventListener("click", function () { if (!on) power(true); tune(s, true); });
      elList.appendChild(b);
    });
    markList();
  }
  function markList() {
    Array.prototype.slice.call(elList.querySelectorAll(".row")).forEach(function (r) {
      r.classList.toggle("on", !!current && r.dataset.id === current.id);
    });
  }
  function message(text, retry) {
    elList.textContent = "";
    var d = document.createElement("div"); d.className = "empty"; d.textContent = text;
    if (retry) {
      var b = document.createElement("button"); b.type = "button"; b.className = "key"; b.textContent = "Try again";
      b.addEventListener("click", fetchStations);
      d.appendChild(document.createElement("br")); d.appendChild(b);
    }
    elList.appendChild(d);
  }
  function normalise(rows) {
    return rows.filter(function (r) { return r.url_resolved && /^https:/i.test(r.url_resolved) && r.name && r.name.trim(); })
      .map(function (r) {
        var name = r.name.trim().replace(/\s+/g, " ").slice(0, 60);
        return { id: r.stationuuid, name: name, url: r.url_resolved, bitrate: r.bitrate || 0, tags: r.tags || "",
                 hay: (name + " " + (r.tags || "") + " " + (r.state || "") + " " + (r.language || "")).toLowerCase() };
      });
  }
  function fetchStations() {
    var cache = load("fm.cache", null);
    if (cache && cache.rows && Date.now() - cache.at < 864e5) { all = cache.rows; buildBand(); return; }
    message("Scanning for stations");
    var i = 0;
    (function attempt() {
      if (i >= MIRRORS.length) {
        if (cache && cache.rows) { all = cache.rows; buildBand(); return; }
        elName.textContent = "No stations";
        message("Could not reach the station directory. Check your internet connection.", true);
        return;
      }
      var url = "https://" + MIRRORS[i++] + ".api.radio-browser.info/json/stations/search?countrycode=IN&hidebroken=true&is_https=true&order=clickcount&reverse=true&limit=800";
      var ctl = "AbortController" in window ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 8000);
      fetch(url, ctl ? { signal: ctl.signal } : {}).then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (rows) {
          clearTimeout(timer);
          all = normalise(rows);
          if (!all.length) throw 0;
          save("fm.cache", { at: Date.now(), rows: all });
          buildBand();
        }).catch(function () { clearTimeout(timer); attempt(); });
    })();
  }

  /* ---------- start ---------- */
  REGIONS.forEach(function (r) { var o = document.createElement("option"); o.textContent = r[0]; elRegion.appendChild(o); });
  elRegion.value = load("fm.region", "Mumbai");
  if (!elRegion.value) elRegion.value = "Mumbai";
  elRegion.addEventListener("change", function () { save("fm.region", elRegion.value); elSearch.value = ""; buildBand(); });
  var st = null;
  elSearch.addEventListener("input", function () { clearTimeout(st); st = setTimeout(buildBand, 250); });

  // Home screen icon drawn in the page so the app stays a single file.
  try {
    var c = document.createElement("canvas"); c.width = c.height = 180;
    var g = c.getContext("2d");
    g.fillStyle = "#14171c"; g.fillRect(0, 0, 180, 180);
    g.fillStyle = "#2a1c08"; g.fillRect(20, 34, 140, 62);
    g.fillStyle = "#ffb347"; g.font = "bold 44px monospace"; g.textAlign = "center"; g.fillText("98.3", 90, 82);
    g.fillStyle = "#c9cfd8"; for (var k = 0; k < 12; k++) g.fillRect(24 + k * 12, 116, 2, k % 3 ? 14 : 26);
    g.fillStyle = "#ff4b3a"; g.fillRect(88, 108, 4, 44);
    var link = document.createElement("link"); link.rel = "apple-touch-icon"; link.href = c.toDataURL("image/png");
    document.head.appendChild(link);
  } catch (e) {}

  renderPresets();
  renderDial(false);
  fetchStations();
})();
</script>
</body>
</html>
